name: Lab 1 CI/CD

on:
  push:
    paths:
      - "lab1/**"
      - ".github/workflows/lab1.yml"
  pull_request:
    paths:
      - "lab1/**"
      - ".github/workflows/lab1.yml"

permissions:
  contents: write

jobs:
  test:
    name: Build, test, coverage and lint (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install gcovr llvm

      - name: Configure
        run: |
          cmake \
            -S lab1 \
            -B lab1/build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_COVERAGE=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Lint
        working-directory: lab1
        run: |
          "$(brew --prefix llvm)/bin/clang-tidy" -p build \
            --checks='-*,clang-analyzer-*' \
            --warnings-as-errors='clang-analyzer-*' \
            Set/src/set.cpp Set/main.cpp \
            Multiset/src/multiset.cpp Multiset/main.cpp

      - name: Build
        run: cmake --build lab1/build --parallel

      - name: Test
        run: ctest --test-dir lab1/build --output-on-failure

      - name: Coverage
        working-directory: lab1
        run: |
          gcovr -r . \
            --gcov-executable "xcrun llvm-cov gcov" \
            --filter 'Set/src/' \
            --filter 'Multiset/src/' \
            --print-summary \
            --fail-under-line 90 \
            build

      - name: Build Release binaries
        run: |
          cmake \
            -S lab1 \
            -B lab1/build-release \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build lab1/build-release --parallel \
            --target set_app multiset_app

      - name: Prepare release files
        run: |
          mkdir -p release
          cp lab1/build-release/Set/set_app release/set
          cp lab1/build-release/Multiset/multiset_app release/multiset

      - name: Create archive
        run: tar -czf lab1.tar.gz -C release .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lab1
          path: lab1.tar.gz

  release:
    name: Create GitHub Release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: lab1
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lab1-${{ github.run_number }}
          name: Lab 1 ${{ github.run_number }}
          generate_release_notes: true
          files: release/lab1.tar.gz