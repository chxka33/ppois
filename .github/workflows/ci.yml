name: Lab 1 CI/CD

on:
  push:
    branches:
      - lab1
      - main
      - lab1-feature
    paths:
      - 'lab1/**'
      - '.github/workflows/lab1.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'lab1/**'
      - '.github/workflows/lab1.yml'

permissions:
  contents: read

jobs:
  test:
    name: Build, test, coverage and lint
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install cmake gcovr llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      # ================= SET =================
      - name: Configure Set
        run: |
          cmake \
            -S lab1/Set \
            -B lab1/Set/build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DENABLE_COVERAGE=ON

      - name: Build Set
        run: cmake --build lab1/Set/build --parallel

      - name: Test Set
        run: |
          ctest \
            --test-dir lab1/Set/build \
            --output-on-failure

      - name: Coverage Set
        working-directory: lab1/Set
        run: |
          gcovr \
            --root . \
            --object-directory build \
            --gcov-executable "$(brew --prefix llvm)/bin/llvm-cov gcov" \
            --filter '.*/src/set\.cpp$' \
            --exclude 'tests/.*' \
            --exclude 'build/.*' \
            --print-summary \
            --fail-under-line 90

      - name: Lint Set
        working-directory: lab1/Set
        run: |
          clang-tidy src/set.cpp -p build \
            --checks='-*,clang-analyzer-*,-clang-analyzer-security.insecureAPI.rand'

      # ================= MULTISET =================
      - name: Configure Multiset
        run: |
          cmake \
            -S lab1/Multiset \
            -B lab1/Multiset/build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DENABLE_COVERAGE=ON

      - name: Build Multiset
        run: cmake --build lab1/Multiset/build --parallel

      - name: Test Multiset
        run: |
          ctest \
            --test-dir lab1/Multiset/build \
            --output-on-failure

      - name: Coverage Multiset
        working-directory: lab1/Multiset
        run: |
          gcovr \
            --root . \
            --object-directory build \
            --gcov-executable "$(brew --prefix llvm)/bin/llvm-cov gcov" \
            --filter '.*/src/multiset\.cpp$' \
            --exclude 'tests/.*' \
            --exclude 'build/.*' \
            --print-summary \
            --fail-under-line 90

      - name: Lint Multiset
        working-directory: lab1/Multiset
        run: |
          clang-tidy src/multiset.cpp -p build \
            --checks='-*,clang-analyzer-*,-clang-analyzer-security.insecureAPI.rand'

      # ================= RELEASE BUILDS =================
      - name: Configure Set Release
        run: |
          cmake \
            -S lab1/Set \
            -B lab1/Set/release-build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Set Release
        run: cmake --build lab1/Set/release-build --parallel

      - name: Configure Multiset Release
        run: |
          cmake \
            -S lab1/Multiset \
            -B lab1/Multiset/release-build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Multiset Release
        run: cmake --build lab1/Multiset/release-build --parallel

      - name: Prepare release files
        run: |
          mkdir -p release
          
          # Обратите внимание: имена файлов должны совпадать с теми, 
          # что вы указали в add_executable() в CMakeLists.txt.
          # Если таргет называется просто 'set', замените set_app на set.
          cp lab1/Set/release-build/set_app release/set_app
          cp lab1/Multiset/release-build/multiset_app release/multiset_app

          tar -czf lab1-macos.tar.gz -C release .

      - name: Upload build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: lab1-macos
          path: lab1-macos.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: lab1-macos
          path: release

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lab1-${{ github.run_number }}
          name: Lab 1 ${{ github.run_number }}
          generate_release_notes: true
          files: release/lab1-macos.tar.gz